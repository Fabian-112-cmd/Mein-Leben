const RECURRENCE_MONTHS={'Monatlich':1,'Vierteljährlich':3,'Halbjährlich':6,'Jährlich':12};
function plusDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addPeriod(iso,period){const d=new Date(iso+'T12:00:00');if(period==='Wöchentlich')return plusDays(iso,7);const months=RECURRENCE_MONTHS[period];if(!months)return iso;const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+months);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function occurrence(iso,period){if(!iso||!period||period==='Nie')return iso;let next=iso;for(let i=0;i<1200&&next<today();i++){const n=addPeriod(next,period);if(n===next)break;next=n}return next}

function noticeDate(iso,count,unit){if(!iso||!Number.isFinite(Number(count))||Number(count)<=0)return '';const n=Math.min(3650,Math.floor(Number(count)));if(unit==='Monate'){const d=new Date(iso+'T12:00:00');const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()-n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}return plusDays(iso,-n*(unit==='Wochen'?7:1))}

function upcomingEvents(){const result=[];for(const r of records){const d=r.details||{};if(r.kind==='tasks'&&d.status==='Erledigt')continue;const remind=Math.max(0,Math.min(365,Number(d.remind_days??7)||0));const dates=[];if(r.due_date)dates.push({label:r.kind==='vehicles'?'TÜV':names[r.kind],iso:r.due_date,period:d.recurrence});if(['contracts','insurances'].includes(r.kind)&&r.due_date&&Number(d.notice_count)>0){const cutoff=noticeDate(r.due_date,d.notice_count,d.notice_unit);if(cutoff)dates.push({label:'Späteste Kündigung',iso:cutoff})}if(r.kind==='vehicles'){for(const [field,label] of [['nextservice','Service'],['nextinspection','Inspektion'],['tirechange','Reifenwechsel'],['financeend','Leasing / Finanzierung']])if(d[field])dates.push({label,iso:d[field]})}for(const item of dates){const due=occurrence(item.iso,item.period),alert=plusDays(due,-remind);result.push({r,label:item.label,date:due,alert,remind,recurrence:item.period||'Nie'})}}return result.sort((a,b)=>a.date.localeCompare(b.date))}

function calendarView(){const now=new Date(),base=new Date(now.getFullYear(),now.getMonth()+calendarOffset,1),year=base.getFullYear(),month=base.getMonth(),first=(base.getDay()+6)%7,days=new Date(year,month+1,0).getDate(),monthName=base.toLocaleDateString('de-DE',{month:'long',year:'numeric'}),all=calendarEvents();if(!calendarDay||calendarDay.slice(0,7)!==year+'-'+String(month+1).padStart(2,'0'))calendarDay=year+'-'+String(month+1).padStart(2,'0')+'-'+String(Math.min(now.getDate(),days)).padStart(2,'0');const cells=Array.from({length:first},()=>'<button class="cal-day" disabled></button>');for(let d=1;d<=days;d++){const iso=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),events=all.filter(x=>x.date===iso);cells.push(`<button class="cal-day ${calendarDay===iso?'selected':''}" data-calendar-day="${iso}"><b>${d}</b>${events.length?`<span class="cal-dot">${events.length} Termin${events.length!==1?'e':''}</span>`:''}</button>`)}const selected=all.filter(x=>x.date===calendarDay);return `<div class="feature-box"><div class="feature-head"><h2>▦ ${esc(monthName)}</h2><div class="feature-actions"><button class="btn secondary small" data-cal-nav="-1">←</button><button class="btn secondary small" data-cal-today="1">Heute</button><button class="btn secondary small" data-cal-nav="1">→</button></div></div><div class="cal-weekdays">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<span>${x}</span>`).join('')}</div><div class="cal-grid">${cells.join('')}</div></div><div class="feature-box"><h3>${esc(date(calendarDay))}</h3><div class="feature-list">${selected.length?selected.map(x=>`<div class="feature-row"><div><b>${esc(x.r.title)}</b><small>${esc(x.label)}</small></div><button class="btn secondary small" data-edit="${x.r.id}">Öffnen</button></div>`).join(''):'<p class="muted">Keine Termine oder Fristen an diesem Tag.</p>'}</div><button class="btn" data-quick="appointments" style="margin-top:12px">+ Termin</button></div>`}
function templatesView(){return `<div class="feature-head"><h2>☑ Checklisten & Vorlagen</h2></div><div class="feature-box"><p class="feature-muted">Erstelle aus einer Vorlage eine Aufgabe mit abhakebaren Unterpunkten.</p><div class="feature-list">${Object.entries(TEMPLATE_PRESETS).map(([name,items])=>`<div class="feature-row"><div><b>${esc(name)}</b><small>${esc(items.join(' · '))}</small></div><button class="btn secondary small" data-create-template="${esc(name)}">Verwenden</button></div>`).join('')}</div></div><div class="feature-box"><h3>Eigene Checkliste erstellen</h3><div class="feature-control"><input id="customTemplateTitle" placeholder="Titel der Checkliste" style="flex:1"><textarea id="customTemplateItems" placeholder="Ein Punkt pro Zeile"></textarea><button class="btn" id="customTemplateCreate">Checkliste anlegen</button></div></div>`}

ass="feature-control" style="margin-top:14px"><input type="file" id="importJson" accept="application/json,.json" class="file-picker"><button class="btn secondary" id="importButton">JSON wiederherstellen</button></div><p class="feature-muted">Import ergänzt Einträge, er überschreibt keine vorhandenen Daten. Dateiverweise funktionieren nur, wenn die Dateien noch im selben Supabase-Projekt existieren.</p></div><div class="feature-box"><h3>🔔 iPhone-Push-Benachrichtigungen</h3><p class="feature-muted">Für Benachrichtigungen bei geschlossener App ist eine einmalige Server-Einrichtung erforderlich. Auf iPhones muss die App zum Home-Bildschirm hinzugefügt sein (iOS 16.4 oder neuer).</p><div class="feature-actions"><button class="btn" id="enablePush">Push aktivieren</button><button class="btn secondary" id="disablePush">Push deaktivieren</button></div><p id="pushStatus" class="feature-muted">Status wird beim Öffnen geprüft.</p></div>`}
function downloadFile(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportBackup(){const payload={app:'Mein Alltag',version:2,exported_at:new Date().toISOString(),user_id:session.user.id,records:records.map(r=>({kind:r.kind,title:r.title,note:r.note,due_date:r.due_date,details:r.details}))};downloadFile('Mein-Alltag-Backup-'+today()+'.json',JSON.stringify(payload,null,2),'application/json')}
function exportCsv(){const cols=['Bereich','Titel','Notiz','Datum','Details'];const csv=[cols,...records.map(r=>[names[r.kind]||r.kind,r.title,r.note,r.due_date,JSON.stringify(r.details||{})])].map(row=>row.map(v=>'"'+String(v??'').replace(/^[=+@\-\t\r]/,'\u0027$&').replace(/"/g,'""')+'"').join(';')).join('\r\n');downloadFile('Mein-Alltag-'+today()+'.csv','\ufeff'+csv,'text/csv;charset=utf-8')}
async function importBackup(){const f=$('importJson')?.files?.[0];if(!f){toast('Bitte zuerst eine JSON-Datei auswählen.');return}try{if(f.size>8*1024*1024)throw Error('Datei zu groß.');const data=JSON.parse(await f.text());if(data.app!=='Mein Alltag'||!Array.isArray(data.records)||data.records.length>2000)throw Error('Ungültige Sicherungsdatei.');if(data.user_id!==session.user.id)throw Error('Die Sicherung gehört zu einem anderen Benutzer.');const allowed=new Set(Object.keys(types));const rows=data.records.map(r=>{if(!allowed.has(r.kind)||typeof r.title!=='string'||!r.title.trim()||r.title.length>500)throw Error('Ungültiger Eintrag.');return {user_id:session.user.id,kind:r.kind,title:r.title,note:typeof r.note==='string'?r.note:'',due_date:/^\d{4}-\d{2}-\d{2}$/.test(r.due_date||'')?r.due_date:null,details:r.details&&typeof r.details==='object'&&!Array.isArray(r.details)?r.details:{}}});if(!confirm(rows.length+' Einträge zusätzlich importieren? Bestehende Einträge bleiben erhalten.'))return;for(let i=0;i<rows.length;i+=50){const {error}=await client.from('mein_leben_entries').insert(rows.slice(i,i+50));if(error)throw error}toast(rows.length+' Einträge importiert.');await load()}catch(e){toast('Import fehlgeschlagen: '+e.message)}}
async function createChecklist(name,items){const clean=items.map(s=>s.trim()).filter(Boolean).slice(0,60);if(!name.trim()||!clean.length){toast('Bitte Titel und Punkte eingeben.');return}const payload={user_id:session.user.id,kind:'tasks',title:name.trim(),note:'Checkliste',due_date:null,details:{status:'Offen',priority:'Normal',checklist:clean.map(text=>({text,done:false}))}};const {error}=await client.from('mein_leben_entries').insert(payload);if(error)toast('Checkliste konnte nicht gespeichert werden: '+error.message);else{toast('Checkliste erstellt');navigate('tasks');await load()}}

async function enablePush(){try{if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window))throw Error('Push wird auf diesem Gerät oder Browser nicht unterstützt.');if(!window.matchMedia('(display-mode: standalone)').matches&&/iPad|iPhone|iPod/.test(navigator.userAgent))throw Error('Bitte Mein Alltag zuerst zum Home-Bildschirm hinzufügen und von dort öffnen.');if(!PUSH_PUBLIC_KEY)throw Error('Der Push-Server ist noch nicht eingerichtet. Siehe PUSH-EINRICHTUNG.md.');const permission=await Notification.requestPermission();if(permission!=='granted')throw Error('Benachrichtigungen wurden nicht erlaubt.');const reg=await navigator.serviceWorker.register('./push-sw.js');const ready=await navigator.serviceWorker.ready;let sub=await ready.pushManager.getSubscription();if(!sub)sub=await ready.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(PUSH_PUBLIC_KEY)});const json=sub.toJSON();const {error}=await client.from('mein_alltag_push_subscriptions').upsert({user_id:session.user.id,endpoint:json.endpoint,p256dh:json.keys.p256dh,auth:json.keys.auth,enabled:true},{onConflict:'endpoint'});if(error)throw error;toast('Push-Benachrichtigungen aktiviert');updatePushStatus()}catch(e){toast('Push: '+e.message);updatePushStatus()}}
async function disablePush(){try{const reg=await navigator.serviceWorker.getRegistration('./push-sw.js');const sub=await reg?.pushManager.getSubscription();if(sub){await client.from('mein_alltag_push_subscriptions').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe()}toast('Push auf diesem Gerät deaktiviert');updatePushStatus()}catch(e){toast('Push: '+e.message)}}
function urlBase64ToUint8Array(base64){const padding='='.repeat((4-base64.length%4)%4),raw=atob((base64+padding).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(raw,c=>c.charCodeAt(0))}
const PUSH_PUBLIC_KEY=''; // Nach Erzeugung der VAPID-Schlüssel hier den öffentlichen Schlüssel eintragen.
async function updatePushStatus(){const el=$('pushStatus');if(!el)return;if(!PUSH_PUBLIC_KEY){el.textContent='Noch nicht eingerichtet: VAPID-Schlüssel und Supabase-Edge-Function fehlen.';return}try{const reg=await navigator.serviceWorker.getRegistration('./push-sw.js');el.textContent=await reg?.pushManager.getSubscription()?'Push ist auf diesem Gerät registriert.':'Push ist auf diesem Gerät noch nicht aktiviert.'}catch{el.textContent='Push-Status nicht verfügbar.'}}

 document.querySelectorAll('[data-tile-visible],[data-tile-move]').forEach(b=>b.addEventListener(b.dataset.tileVisible?'change':'click',()=>{const key=dashboardKey()+'_tiles',cfg=JSON.parse(localStorage.getItem(key)||'{}');cfg.order=[...new Set([...(cfg.order||[]),'tasks','notes','insurances','contracts','vehicles','appointments'])];cfg.hidden=cfg.hidden||[];if(b.dataset.tileVisible){cfg.hidden=b.checked?cfg.hidden.filter(x=>x!==b.dataset.tileVisible):[...new Set([...cfg.hidden,b.dataset.tileVisible])]}else{const i=cfg.order.indexOf(b.dataset.tileMove),j=i+Number(b.dataset.direction);if(j>=0&&j<cfg.order.length)[cfg.order[i],cfg.order[j]]=[cfg.order[j],cfg.order[i]]}localStorage.setItem(key,JSON.stringify(cfg));render()}));

let formKind='';function openForm(k,id=null){formKind=k;editId=id;const r=records.find(x=>x.id===id),d=r?.details||{};$('modalTitle').textContent=(id?'Bearbeiten: ':'Neu: ')+types[k];const fs=[['title',k==='vehicles'?'Fahrzeugname / Bezeichnung':'Bezeichnung'],...(fields[k]||[]),['note','Bemerkung','textarea']];$('entryFields').innerHTML=fs.map(([key,label,type='text',options])=>{const val=key==='title'?r?.title:key==='note'?r?.note:key==='due_date'?r?.due_date:d[key];let inp=type==='textarea'?`<textarea name="${key}">${esc(val)}</textarea>`:type==='select'?`<select name="${key}">${options.split('|').map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input name="${key}" type="${type}" ${type==='number'?'step="0.01"':''} value="${esc(val)}" ${key==='title'?'required':''}>`;return `<label class="${type==='textarea'?'wide':''}">${label}${inp}</label>`}).join('');if(k==='vehicles'){$('entryFields').insertAdjacentHTML('beforeend',`<div class="vehicle-photo-field"><strong>🚘 Fahrzeugbild für die Übersicht</strong><small>Eigenes Foto hochladen (JPG, PNG oder WebP, maximal 10 MB). Es erscheint links neben deinem Fahrzeug.</small><img id="vehiclePhotoPreview" class="vehicle-photo-preview hidden" alt="Vorschau Fahrzeugbild"><input type="file" id="vehicleCoverInput" accept="image/jpeg,image/png,image/webp,image/heic,image/heif"></div>`);const input=$('vehicleCoverInput'),preview=$('vehiclePhotoPreview');const existing=vehicleImagePath(r||{});if(existing){client.storage.from('mein-alltag-dateien').createSignedUrl(existing,3600).then(({data,error})=>{if(!error&&data?.signedUrl&&input.isConnected&&!input.files.length){preview.src=data.signedUrl;preview.classList.remove('hidden')}})}input.onchange=()=>{const file=input.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{preview.src=reader.result;preview.classList.remove('hidden')};reader.readAsDataURL(file)}}if(k==='vehicles'){$('entryFields').insertAdjacentHTML('beforeend',historyList(r));const h=$('addHistory');h.onclick=async()=>{if(!r){toast('Bitte Fahrzeug zuerst speichern.');return}const title=$('historyTitle').value.trim();if(!title){toast('Bitte Art der Wartung eingeben.');return}const entry={id:crypto.randomUUID(),date:$('historyDate').value,title,mileage:$('historyKm').value,cost:$('historyCost').value,note:$('historyNote').value};await updateHistory(r,[...(r.details?.service_log||[]),entry])};document.querySelectorAll('[data-history-remove]').forEach(b=>b.onclick=async()=>{if(!confirm('Historieneintrag löschen?'))return;await updateHistory(r,(r.details?.service_log||[]).filter(x=>x.id!==b.dataset.historyRemove))})}
 if(k==='tasks'){$('entryFields').insertAdjacentHTML('beforeend',checklistForm(r));document.querySelectorAll('[data-checkitem]').forEach(b=>b.onchange=()=>{const list=r?.details?.checklist||[];if(list[Number(b.dataset.checkitem)])list[Number(b.dataset.checkitem)].done=b.checked})}
 $('newAttachments').value='';renderAttachments(r);$('modal').classList.remove('hidden')}
$('cancelModal').onclick=()=>$('modal').classList.add('hidden');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.add('hidden')};
function renderAttachments(r){const box=$('attachmentList'),a=r?.details?.attachments||[];box.innerHTML=a.length?a.map((f,i)=>`<span class="attachment-pill"><a href="#" data-openattachment="${i}" title="Öffnen">📎 ${esc(f.name)}</a><button type="button" data-removeattachment="${i}" title="Datei löschen">✕</button></span>`).join(''):'<span class="muted">Noch keine Dateien hinterlegt.</span>';box.querySelectorAll('[data-openattachment]').forEach(b=>b.onclick=async e=>{e.preventDefault();const f=a[Number(b.dataset.openattachment)];const {data,error}=await client.storage.from('mein-alltag-dateien').createSignedUrl(f.path,60);if(error){toast('Datei konnte nicht geöffnet werden: '+error.message);return}window.open(data.signedUrl,'_blank','noopener,noreferrer')});box.querySelectorAll('[data-removeattachment]').forEach(b=>b.onclick=async()=>{if(!r?.id||!confirm('Datei dauerhaft löschen?'))return;const f=a[Number(b.dataset.removeattachment)];const {error:storageError}=await client.storage.from('mein-alltag-dateien').remove([f.path]);if(storageError){toast('Datei konnte nicht gelöscht werden: '+storageError.message);return}const next=a.filter(x=>x.path!==f.path),details={...r.details,attachments:next};if(details.vehicle_image_path===f.path)delete details.vehicle_image_path;const {error}=await client.from('mein_leben_entries').update({details}).eq('id',r.id);if(error){toast('Dateiliste konnte nicht aktualisiert werden: '+error.message);return}r.details=details;renderAttachments(r);toast('Datei gelöscht')})}
const ACCEPTED_MIMES=new Set(['image/jpeg','image/png','image/webp','image/heic','image/heif','application/pdf']);
async function uploadAttachments(entryId,details,files,coverFile=null){const attachments=[...(details.attachments||[])];if(attachments.length+files.length>20)throw new Error('Maximal 20 Dateien pro Eintrag.');for(const f of files){if(f.size>10*1024*1024)throw new Error('Datei zu groß (max. 10 MB): '+f.name);if(!ACCEPTED_MIMES.has(f.type))throw new Error('Dateityp nicht erlaubt: '+f.name);const clean=f.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(-100)||'datei';const path=session.user.id+'/'+entryId+'/'+crypto.randomUUID()+'-'+clean;const {error}=await client.storage.from('mein-alltag-dateien').upload(path,f,{contentType:f.type,upsert:false});if(error)throw new Error(error.message);attachments.push({name:f.name,path,mime:f.type,size:f.size});if(coverFile===f)details.vehicle_image_path=path}const next={...details,attachments};const {error}=await client.from('mein_leben_entries').update({details:next}).eq('id',entryId);if(error)throw new Error(error.message);return next}
$('entryForm').onsubmit=async e=>{e.preventDefault();if(!session)return;const button=e.target.querySelector('button[type="submit"]');button.disabled=true;button.textContent='Speichern …';try{const fd=new FormData(e.target),title=String(fd.get('title')||'').trim(),note=String(fd.get('note')||''),due_date=fd.get('due_date')||null,old=records.find(x=>x.id===editId),details={...(old?.details||{})};for(const [k,v] of fd.entries())if(!['title','note','due_date'].includes(k))details[k]=v;if(formKind==='tasks'){const lines=($('checklistEditor')?.value||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean).slice(0,100);const oldChecklist=old?.details?.checklist||[];details.checklist=lines.map(text=>({text,done:!!oldChecklist.find(x=>x.text===text)?.done}))}const payload={title,note,due_date,details,kind:formKind,user_id:session.user.id};const {data,error}=editId?await client.from('mein_leben_entries').update(payload).eq('id',editId).select('id').single():await client.from('mein_leben_entries').insert(payload).select('id').single();if(error)throw error;const coverFile=formKind==='vehicles'?$('vehicleCoverInput')?.files?.[0]:null;const files=[...(coverFile?[coverFile]:[]),...Array.from($('newAttachments').files||[])];let message='Gespeichert';if(files.length){try{await uploadAttachments(data.id,details,files,coverFile);message='Gespeichert · '+files.length+' Datei(en) hochgeladen'}catch(uploadError){message='Eintrag gespeichert, aber Datei-Upload fehlgeschlagen: '+uploadError.message}}$('modal').classList.add('hidden');toast(message);await load()}catch(error){toast('Speichern fehlgeschlagen: '+error.message)}finally{button.disabled=false;button.textContent='Speichern'}};
async function remove(id){if(!confirm('Eintrag wirklich löschen?'))return;const r=records.find(x=>x.id===id);const paths=(r?.details?.attachments||[]).map(x=>x.path).filter(Boolean);if(paths.length){const {error:storageError}=await client.storage.from('mein-alltag-dateien').remove(paths);if(storageError){toast('Dateien konnten nicht gelöscht werden: '+storageError.message);return}}const {error}=await client.from('mein_leben_entries').delete().eq('id',id);if(error){toast('Eintrag konnte nicht gelöscht werden: '+error.message);return}toast('Gelöscht');await load()}
async function done(id){const r=records.find(x=>x.id===id);if(!r)return;let details={...r.details},due_date=r.due_date;if(details.status==='Erledigt'){details.status='Offen'}else if(details.recurrence&&details.recurrence!=='Nie'&&r.due_date){details.status='Offen';const base=occurrence(r.due_date,details.recurrence);due_date=addPeriod(base,details.recurrence);details.last_completed=today()}else{details.status='Erledigt'}const {error}=await client.from('mein_leben_entries').update({details,due_date}).eq('id',id);if(error)toast(error.message);else{toast(due_date!==r.due_date?'Erledigt · nächster Termin: '+date(due_date):'Status aktualisiert');await load()}}
init();})();
