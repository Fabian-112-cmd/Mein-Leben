function itemLine(r){const d=r.details||{},isTask=r.kind==='tasks';let parts=[];if(r.due_date)parts.push('▦ '+date(r.due_date));if(d.provider)parts.push(d.provider);if(d.plate)parts.push(d.plate);if(d.amount)parts.push(fmt(d.amount)+' · '+(d.frequency||''));if(d.category)parts.push(d.category);if(isTask)parts.push(d.status||'Offen');return `<div class="item"><div style="min-width:0"><b>${esc(r.title)}</b><small>${esc(parts.join(' · '))}</small>${r.note?`<small class="details">${esc(r.note)}</small>`:''}</div><div class="actions">${isTask?`<button class="btn secondary small" data-done="${r.id}" title="Status ändern">✓</button>`:''}<button class="btn secondary small" data-edit="${r.id}" title="Bearbeiten">✎</button><button class="btn danger small" data-del="${r.id}" title="Löschen">×</button></div></div>`}
const modernIcons={"home": "<path d=\"m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z\"/>", "tasks": "<rect x=\"3\" y=\"4\" width=\"18\" height=\"17\" rx=\"3\"/><path d=\"m7 12 3 3 7-7\"/>", "notes": "<rect x=\"5\" y=\"3\" width=\"14\" height=\"18\" rx=\"2\"/><path d=\"M9 8h6M9 12h6M9 16h4\"/>", "insurances": "<path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z\"/><path d=\"m9 12 2 2 4-4\"/>", "contracts": "<path d=\"M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z\"/><path d=\"M14 2v6h6M8 12h8M8 16h8\"/>", "vehicles": "<path d=\"M5 11 7 5h10l2 6M4 11h16a2 2 0 0 1 2 2v5H2v-5a2 2 0 0 1 2-2Z\"/><circle cx=\"6\" cy=\"15\" r=\"1\"/><circle cx=\"18\" cy=\"15\" r=\"1\"/><path d=\"M5 18v3M19 18v3\"/>", "appointments": "<rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M7 3v4M17 3v4M3 10h18M8 14h2M14 14h2\"/>", "links": "<rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/>"};
function vectorIcon(k){return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${modernIcons[k]||modernIcons.home}</svg>`}
function home(){const active=records.filter(r=>r.kind==='tasks'&&r.details?.status!=='Erledigt'),upcoming=records.filter(r=>r.due_date&&r.due_date>=today()&&(r.kind!=='tasks'||r.details?.status!=='Erledigt')).sort((a,b)=>a.due_date.localeCompare(b.due_date)).slice(0,5),counts={tasks:active.length,notes:records.filter(r=>r.kind==='notes').length,insurances:records.filter(r=>r.kind==='insurances').length,contracts:records.filter(r=>r.kind==='contracts').length,vehicles:records.filter(r=>r.kind==='vehicles').length,appointments:records.filter(r=>r.kind==='appointments').length},icons={tasks:vectorIcon('tasks'),notes:vectorIcon('notes'),insurances:vectorIcon('insurances'),contracts:vectorIcon('contracts'),vehicles:vectorIcon('vehicles'),appointments:vectorIcon('appointments')},now=new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});return `<div class="hero"><div class="eyebrow">⌂ &nbsp; Mein Alltag · Deine private Organisation</div><div><h1>Hallo Fabian 👋</h1><p>${esc(now)}</p></div></div><div class="grid dashboard-grid">${Object.keys(counts).map(k=>`<div class="card" data-go="${k}"><div class="ico">${icons[k]}</div><span class="tile-text"><strong>${names[k]}</strong><small>${k==='tasks'?'Offene Aufgaben':counts[k]+' Einträge'}</small></span>${counts[k]&&['tasks','appointments'].includes(k)?`<span class="count">${counts[k]}</span>`:''}</div>`).join('')}</div><div class="dashboard-link" data-go="links"><span style="font-size:27px;color:#16613e">▱</span><span><b>Meine Apps</b><small>Finanzen, Unser Glück, TimeTree</small></span><span class="arrow">›</span></div><section class="section"><h2>▦ &nbsp; Nächste Termine & Fristen</h2><div class="panel">${upcoming.length?upcoming.map(itemLine).join(''):'<div class="empty">Noch keine anstehenden Termine oder Fristen.</div>'}</div></section><section class="section"><h2>☑ &nbsp; Offene Aufgaben</h2><div class="panel">${active.length?active.slice(0,4).map(itemLine).join(''):'<div class="empty">Keine offenen Aufgaben.</div>'}</div></section>`}
function more(){return `<div class="grid">${['insurances','contracts','vehicles','links'].map(k=>`<div class="card" data-go="${k}"><div class="ico">${({insurances:'⬡',contracts:'▣',vehicles:'🚘',links:'↗'})[k]}</div><strong>${names[k]}</strong><small>Öffnen</small></div>`).join('')}</div><section class="section panel"><h2>Mein Alltag</h2><p class="muted">Private Organisation für Fabian.</p><button class="btn secondary" id="mobileLogout">Abmelden</button></section>`}
function links(){const arr=[['💶','Meine Finanzen','https://fabian-112-cmd.github.io/Finanz-App/'],['💚','Unser Glück','https://fabian-112-cmd.github.io/Papa-App/'],['🗓','TimeTree','https://timetreeapp.com/']];return `<div class="links">${arr.map(([icon,name,url])=>`<a class="linkcard" href="${url}" target="_blank" rel="noopener noreferrer"><strong>${icon} ${name} ↗</strong><span class="muted">Externe App öffnen · keine Datenübertragung</span></a>`).join('')}</div><p class="muted">Diese Apps bleiben unabhängig. TimeTree wird nur geöffnet, nicht synchronisiert.</p>`}
function taskListing(){const all=records.filter(r=>r.kind==='tasks'&&[r.title,r.note,...Object.values(r.details||{})].join(' ').toLowerCase().includes(query.toLowerCase())),done=all.filter(r=>r.details?.status==='Erledigt'),open=all.filter(r=>r.details?.status!=='Erledigt').sort((a,b)=>(a.due_date||'9999').localeCompare(b.due_date||'9999')),visible=taskFilter==='done'?done:taskFilter==='due'?open.filter(r=>r.due_date&&r.due_date<=today()):open;const line=r=>{const d=r.details||{},finished=d.status==='Erledigt',p=d.priority==='Dringend'?'high':d.priority==='Wichtig'?'medium':'low';return `<div class="taskrow"><button class="check ${finished?'done':''}" data-done="${r.id}" title="Status ändern">${finished?'✓':''}</button><div class="tasktext ${finished?'done':''}"><b>${esc(r.title)}</b><small>${r.due_date?'▦ bis '+date(r.due_date):'Ohne Fälligkeit'}${r.note?' · '+esc(r.note):''}</small></div><span class="priority ${p}">${esc(d.priority||'Normal')}</span><button class="editicon" data-edit="${r.id}" title="Bearbeiten">✎</button></div>`};return `<div class="filters">${[['all','Alle'],['open','Offen ('+open.length+')'],['done','Erledigt'],['due','Fällig']].map(([k,label])=>`<button class="${taskFilter===k?'active':''}" data-taskfilter="${k}">${label}</button>`).join('')}</div><div class="toolbar"><input id="search" class="search" placeholder="Aufgaben durchsuchen …" value="${esc(query)}"><span class="muted">${visible.length} Aufgaben</span></div><div class="panel">${visible.length?visible.map(line).join(''):'<div class="empty">Keine passenden Aufgaben.</div>'}</div>${taskFilter==='all'&&done.length?`<h3 class="groupheading">✓ Erledigt (${done.length})</h3><div class="panel">${done.map(line).join('')}</div>`:''}`}
function listing(k){let data=records.filter(r=>r.kind===k&&[r.title,r.note,...Object.values(r.details||{})].join(' ').toLowerCase().includes(query.toLowerCase()));if(k==='appointments')data.sort((a,b)=>(a.due_date||'9999').localeCompare(b.due_date||'9999'));return `<div class="toolbar"><input id="search" class="search" placeholder="${names[k]} durchsuchen …" value="${esc(query)}"><span class="muted">${data.length} Einträge</span></div><div class="panel">${data.length?data.map(itemLine).join(''):'<div class="empty">Noch keine Einträge vorhanden. Über „+ Hinzufügen“ kannst du starten.</div>'}</div>`}
function bindContent(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const r=records.find(r=>r.id===b.dataset.edit);if(r)openForm(r.kind,r.id)});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>remove(b.dataset.del));document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>done(b.dataset.done));document.querySelectorAll('[data-taskfilter]').forEach(b=>b.onclick=()=>{taskFilter=b.dataset.taskfilter;render()});const l=$('mobileLogout');if(l)l.onclick=()=>client?.auth.signOut();const s=$('search');if(s)s.oninput=()=>{query=s.value;const pos=s.selectionStart;render();$('search').focus();$('search').setSelectionRange(pos,pos)}}
let formKind='';function openForm(k,id=null){formKind=k;editId=id;const r=records.find(x=>x.id===id),d=r?.details||{};$('modalTitle').textContent=(id?'Bearbeiten: ':'Neu: ')+types[k];const fs=[['title',k==='vehicles'?'Fahrzeugname / Bezeichnung':'Bezeichnung'],...(fields[k]||[]),['note','Bemerkung','textarea']];$('entryFields').innerHTML=fs.map(([key,label,type='text',options])=>{const val=key==='title'?r?.title:key==='note'?r?.note:key==='due_date'?r?.due_date:d[key];let inp=type==='textarea'?`<textarea name="${key}">${esc(val)}</textarea>`:type==='select'?`<select name="${key}">${options.split('|').map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input name="${key}" type="${type}" ${type==='number'?'step="0.01"':''} value="${esc(val)}" ${key==='title'?'required':''}>`;return `<label class="${type==='textarea'?'wide':''}">${label}${inp}</label>`}).join('');$('modal').classList.remove('hidden')}
$('cancelModal').onclick=()=>$('modal').classList.add('hidden');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.add('hidden')};$('entryForm').onsubmit=async e=>{e.preventDefault();if(!session)return;const fd=new FormData(e.target),title=String(fd.get('title')||'').trim(),note=String(fd.get('note')||''),due_date=fd.get('due_date')||null,details={};for(const [k,v] of fd.entries())if(!['title','note','due_date'].includes(k))details[k]=v;const payload={title,note,due_date,details,kind:formKind,user_id:session.user.id};const {error}=editId?await client.from('mein_leben_entries').update(payload).eq('id',editId):await client.from('mein_leben_entries').insert(payload);if(error){toast('Speichern fehlgeschlagen: '+error.message);return}$('modal').classList.add('hidden');toast('Gespeichert');await load()};async function remove(id){if(!confirm('Eintrag wirklich löschen?'))return;const {error}=await client.from('mein_leben_entries').delete().eq('id',id);if(error)toast(error.message);else{toast('Gelöscht');await load()}}async function done(id){const r=records.find(x=>x.id===id);if(!r)return;const details={...r.details,status:r.details?.status==='Erledigt'?'Offen':'Erledigt'};const {error}=await client.from('mein_leben_entries').update({details}).eq('id',id);if(error)toast(error.message);else await load()}init();})();
</script></body></html>
