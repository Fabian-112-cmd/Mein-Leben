function listing(k){let data=records.filter(r=>r.kind===k&&[r.title,r.note,...Object.values(r.details||{})].join(' ').toLowerCase().includes(query.toLowerCase()));if(k==='appointments')data.sort((a,b)=>(a.due_date||'9999').localeCompare(b.due_date||'9999'));return `<div class="toolbar"><input id="search" class="search" placeholder="${names[k]} durchsuchen …" value="${esc(query)}"><span class="muted">${data.length} Einträge</span></div><div class="panel">${data.length?data.map(itemLine).join(''):'<div class="empty">Noch keine Einträge vorhanden. Über „+ Hinzufügen“ kannst du starten.</div>'}</div>`}
function bindContent(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const r=records.find(r=>r.id===b.dataset.edit);if(r)openForm(r.kind,r.id)});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>remove(b.dataset.del));document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>done(b.dataset.done));document.querySelectorAll('[data-taskfilter]').forEach(b=>b.onclick=()=>{taskFilter=b.dataset.taskfilter;render()});const l=$('mobileLogout');if(l)l.onclick=()=>client?.auth.signOut();const s=$('search');if(s)s.oninput=()=>{query=s.value;const pos=s.selectionStart;render();$('search').focus();$('search').setSelectionRange(pos,pos)}}
let formKind='';function openForm(k,id=null){formKind=k;editId=id;const r=records.find(x=>x.id===id),d=r?.details||{};$('modalTitle').textContent=(id?'Bearbeiten: ':'Neu: ')+types[k];const fs=[['title',k==='vehicles'?'Fahrzeugname / Bezeichnung':'Bezeichnung'],...(fields[k]||[]),['note','Bemerkung','textarea']];$('entryFields').innerHTML=fs.map(([key,label,type='text',options])=>{const val=key==='title'?r?.title:key==='note'?r?.note:key==='due_date'?r?.due_date:d[key];let inp=type==='textarea'?`<textarea name="${key}">${esc(val)}</textarea>`:type==='select'?`<select name="${key}">${options.split('|').map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input name="${key}" type="${type}" ${type==='number'?'step="0.01"':''} value="${esc(val)}" ${key==='title'?'required':''}>`;return `<label class="${type==='textarea'?'wide':''}">${label}${inp}</label>`}).join('');$('modal').classList.remove('hidden')}
$('cancelModal').onclick=()=>$('modal').classList.add('hidden');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.add('hidden')};$('entryForm').onsubmit=async e=>{e.preventDefault();if(!session)return;const fd=new FormData(e.target),title=String(fd.get('title')||'').trim(),note=String(fd.get('note')||''),due_date=fd.get('due_date')||null,details={};for(const [k,v] of fd.entries())if(!['title','note','due_date'].includes(k))details[k]=v;const payload={title,note,due_date,details,kind:formKind,user_id:session.user.id};const {error}=editId?await client.from('mein_leben_entries').update(payload).eq('id',editId):await client.from('mein_leben_entries').insert(payload);if(error){toast('Speichern fehlgeschlagen: '+error.message);return}$('modal').classList.add('hidden');toast('Gespeichert');await load()};async function remove(id){if(!confirm('Eintrag wirklich löschen?'))return;const {error}=await client.from('mein_leben_entries').delete().eq('id',id);if(error)toast(error.message);else{toast('Gelöscht');await load()}}async function done(id){const r=records.find(x=>x.id===id);if(!r)return;const details={...r.details,status:r.details?.status==='Erledigt'?'Offen':'Erledigt'};const {error}=await client.from('mein_leben_entries').update({details}).eq('id',id);if(error)toast(error.message);else await load()}init();})();
</script></body></html>
